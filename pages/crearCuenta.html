<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta — Salvia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../estilos/stylesRegistro.css" />
</head>
<body class="auth-body">

  <main class="auth-layout">
    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="logo justify-center">
          <svg class="logo__icon" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
            <path d="M12 21c-4.2-2-7-6-7-10.2A7 7 0 0 1 19 10.8C19 15 16.2 19 12 21Z" fill="var(--color-sage)" />
            <path d="M12 21V8" stroke="var(--color-sage-dark)" stroke-width="1.3" fill="none" />
          </svg>
          Salvia
        </a>
        <h1 class="auth-title">Crea tu cuenta</h1>
        <p class="auth-subtitle">Únete a Salvia y comienza a cuidar tu salud</p>
      </div>

      <form action="#" method="POST" class="auth-form">
        <div class="form-group">
          <label for="name" class="form-label">Nombre completo</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="Ej. Laura Méndez" required />
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="tu@correo.com" required />
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Mínimo 8 caracteres" required />
        </div>

        <div class="form-group">
          <label for="role" class="form-label">¿Cómo usarás Salvia?</label>
          <select id="role" name="role" class="form-input form-select" required>
            <option value="paciente">Soy Paciente</option>
            <option value="doctor">Soy Doctor</option>
          </select>
        </div>

        <!-- Campo visible solo si se elige "Soy Paciente" (controlado con CSS, sin JS) -->
        <div class="form-group form-group--paciente">
          <label for="numeroSeguro" class="form-label">Número de seguro</label>
          <input type="text" id="numeroSeguro" name="numeroSeguro" class="form-input" placeholder="Ej. 0001-2024-0587" />
        </div>

        <!-- Campo visible solo si se elige "Soy Doctor" (controlado con CSS, sin JS) -->
        <div class="form-group form-group--doctor">
          <label for="codigoAcceso" class="form-label">Código de acceso</label>
          <input type="text" id="codigoAcceso" name="codigoAcceso" class="form-input" placeholder="Proporcionado por la clínica" />
        </div>

        <button type="submit" class="btn btn--primary btn--full">Crear cuenta</button>
      </form>

      <div class="auth-footer">
        <p>¿Ya tienes una cuenta? <a href="iniciarSesion.html" class="auth-link">Inicia sesión</a></p>
      </div>
    </div>
  </main>

</body>
</html>
